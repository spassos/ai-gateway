name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e "./broker[dev]" -e "./cli[dev]"
      - name: Lint
        run: |
          ruff check broker cli
          ruff format --check broker cli
      - name: Test broker
        run: cd broker && python -m pytest -q
      - name: Test cli
        run: cd cli && python -m pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build gateway image
        run: docker build ./gateway
      - name: Build broker image
        run: docker build ./broker

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Init (sem backend)
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sobe o stack local (postgres + litellm + broker)
        run: |
          cp .env.example .env
          docker compose up --build -d --wait
      - name: Smoke (provision + completion mock)
        run: make smoke
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs
