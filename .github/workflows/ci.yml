name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e "./broker[dev]" -e "./cli[dev]"
      - name: Lint
        run: |
          ruff check broker cli
          ruff format --check broker cli
      - name: Test broker
        run: cd broker && python -m pytest -q
      - name: Test cli
        run: cd cli && python -m pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build gateway image
        run: docker build ./gateway
      - name: Build broker image
        run: docker build ./broker
