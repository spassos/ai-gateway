# Ambiente de desenvolvimento local — paridade com produção (Cloud Run + Cloud SQL).
# `cp .env.example .env && make up`. Funciona sem credenciais GCP (modelo mock-gpt).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litellm-local-pw}
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-litellm}"]
      interval: 5s
      timeout: 3s
      retries: 10

  litellm:
    build: ./gateway
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://litellm:litellm-local-pw@postgres:5432/litellm}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  broker:
    build: ./broker
    env_file: .env
    environment:
      LITELLM_BASE_URL: http://litellm:4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://litellm:litellm-local-pw@postgres:5432/litellm}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_healthy

volumes:
  pgdata:
